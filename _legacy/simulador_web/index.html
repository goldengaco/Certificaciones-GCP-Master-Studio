<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCP Training Studio — Simulador Oficial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <span class="logo-badge">GCP PREP</span>
      <h1 class="app-title">Google Cloud Certification Master</h1>
    </div>
    
    <div class="nav-stats">
      <div class="stat-pill">
        Aciertos: <strong id="statCorrect">0</strong> / <span id="statTotal">0</span>
      </div>
      <div class="stat-pill">
        Precisión: <strong id="statAccuracy">0%</strong>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <div class="main-container">
    
    <!-- Sidebar / Config -->
    <aside class="sidebar">
      <div>
        <h3>Certificación</h3>
        <div class="cert-selector">
          <button class="nav-btn active" data-cert="ace">
            <span>Associate Cloud Eng.</span>
            <small style="color: var(--gcp-blue);">ACE</small>
          </button>
          <button class="nav-btn" data-cert="pca">
            <span>Cloud Architect</span>
            <small style="color: var(--gcp-yellow);">PCA</small>
          </button>
        </div>
      </div>

      <div>
        <h3>Modalidad de Práctica</h3>
        <div class="mode-selector">
          <button class="nav-btn active" data-mode="study">
            <span>🧠 Modo Estudio</span>
            <small style="color: var(--gcp-green);">Feedback Inmediato</small>
          </button>
          <button class="nav-btn" data-mode="exam">
            <span>⏱️ Modo Examen</span>
            <small style="color: var(--gcp-yellow);">Cronómetro 70%</small>
          </button>
        </div>
      </div>

      <div>
        <h3>Filtrar por Dominio</h3>
        <div class="domain-filters" id="domainFilters">
          <!-- Inyectado dinámicamente por app.js -->
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      
      <!-- Progress Bar & Timer Header -->
      <div class="exam-bar">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="exam-timer" id="timerDisplay" style="display: none;">
          ⏱️ 00:00
        </div>
      </div>

      <!-- Question View -->
      <div id="questionView" class="question-card">
        
        <div class="question-header">
          <div style="display: flex; gap: 10px; align-items: center;">
            <span class="domain-tag" id="currentDomainTag">Dominio</span>
            <span class="logo-badge" style="background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color);" id="currentCertBadge">ACE</span>
          </div>
          <span class="q-number" id="questionNumberDisplay">Pregunta 1 de 10</span>
        </div>

        <div class="keywords-area" id="keywordsContainer">
          <!-- Keywords tags -->
        </div>

        <div class="scenario-box" id="scenarioText">
          Cargando escenario...
        </div>

        <div class="options-grid" id="optionsGrid">
          <!-- Options rendered dynamically -->
        </div>

        <!-- Feedback Area -->
        <div id="feedbackBox" class="feedback-box" style="display: none;">
          <!-- Feedback rendered dynamically -->
        </div>

        <!-- Bottom Navigation -->
        <div class="actions-bar">
          <button class="btn-secondary" id="prevBtn">← Anterior</button>
          <button class="btn-primary" id="nextBtn">Siguiente Pregunta →</button>
          <button class="btn-primary" id="submitExamBtn" style="display: none; background: var(--gcp-green);">Finalizar y Calificar Examen</button>
        </div>

      </div>

      <!-- Results View -->
      <div id="resultsView" class="results-card" style="display: none;">
        <h2>Resultado del Simulador</h2>
        <div id="finalScoreCircle" class="score-circle">
          <span>0%</span>
        </div>
        <p id="finalMessage" style="font-size: 1.1rem; color: var(--text-primary); max-width: 600px;"></p>
        
        <div id="domainBreakdownContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <!-- Breakdown injected -->
        </div>

        <button class="btn-primary" id="restartBtn" style="margin-top: 1.5rem;">Volver a Entrenar</button>
      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
